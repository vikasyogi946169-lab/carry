<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vsSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <linearGradient id="vsTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2A0" />
      <stop offset="100%" stop-color="#008F6B" />
    </linearGradient>
  </defs>

  <!-- Emblem: Setu (Bridge & Highway Path) -->
  <g transform="translate(6, 8)">
    <circle cx="28" cy="28" r="27" fill="#16203D" stroke="#334155" stroke-width="1.5" />
    <!-- Dynamic Bridge Arch -->
    <path d="M8 38 C 17 18, 39 18, 48 38" stroke="url(#vsSaffron)" stroke-width="4.2" stroke-linecap="round" fill="none" />
    <!-- Road center line dashes -->
    <path d="M14 40 C 21 24, 35 24, 42 40" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="3,3" fill="none" opacity="0.9" />
    <!-- Vehicle icon -->
    <path d="M22 20 L33 20 L37 25 L19 25 Z" fill="#00D2A0" />
    <circle cx="23" cy="27" r="2.2" fill="#FFFFFF" />
    <circle cx="33" cy="27" r="2.2" fill="#FFFFFF" />
    <!-- Speed arcs -->
    <path d="M41 18 Q46 22 44 28" stroke="#FF7A00" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography: Pure White for VAHAN so it is 100% VISIBLE in dark mode -->
  <text x="70" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="1">
    <tspan fill="#FFFFFF">VAHAN </tspan>
    <tspan fill="url(#vsSaffron)">SETU</tspan>
  </text>
  
  <!-- Slogan -->
  <text x="71" y="54" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8" letter-spacing="2" fill="#94A3B8">CONNECTING INDIA</text>
</svg>
