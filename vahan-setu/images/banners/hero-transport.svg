<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#3A506B" />
    </linearGradient>
    <linearGradient id="roadGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00D2A0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="bridgePillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="500" fill="url(#skyGrad)" rx="16" />

  <!-- Stars / Digital Network Nodes -->
  <g opacity="0.3">
    <circle cx="90" cy="80" r="1.5" fill="#FFFFFF" />
    <circle cx="210" cy="50" r="2" fill="#FFFFFF" />
    <circle cx="340" cy="110" r="1.5" fill="#FFFFFF" />
    <circle cx="480" cy="70" r="2" fill="#FFFFFF" />
    <circle cx="620" cy="90" r="1.5" fill="#FFFFFF" />
    <circle cx="730" cy="60" r="2" fill="#FFFFFF" />
    <!-- Network Lines -->
    <path d="M90 80 L210 50 L340 110 L480 70 L620 90 L730 60" stroke="#00D2A0" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />
  </g>

  <!-- Distant City Silhouette Skyline -->
  <path d="M0 320 L40 320 L40 280 L70 280 L70 320 L110 320 L110 240 L140 240 L140 210 L160 210 L160 320 L210 320 L210 260 L240 260 L240 320 L280 320 L280 230 L310 230 L330 190 L340 230 L360 320 L410 320 L410 250 L440 250 L440 320 L490 320 L490 220 L530 220 L530 320 L570 320 L570 270 L600 270 L600 320 L650 320 L650 200 L680 200 L700 240 L700 320 L760 320 L760 270 L800 270 L800 320 Z" fill="#0F172A" opacity="0.75" />

  <!-- Setu (Expressway Bridge Arcs) -->
  <!-- Back Tier Flyover -->
  <path d="M-20 380 Q 240 200, 520 280 T 820 220" stroke="#334155" stroke-width="26" fill="none" opacity="0.5" />
  <path d="M-20 380 Q 240 200, 520 280 T 820 220" stroke="#FF7A00" stroke-width="3" fill="none" opacity="0.8" filter="url(#glowEffect)" />

  <!-- Main Multi-Lane Elevated Highway -->
  <path d="M-10 440 C 220 240, 520 240, 810 420" stroke="#1E293B" stroke-width="50" fill="none" />
  <path d="M-10 440 C 220 240, 520 240, 810 420" stroke="url(#roadGlow)" stroke-width="6" fill="none" />
  <!-- Center Dashes -->
  <path d="M-10 440 C 220 240, 520 240, 810 420" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,14" fill="none" opacity="0.7" />

  <!-- Bridge Pillars -->
  <rect x="230" y="320" width="22" height="150" fill="url(#bridgePillar)" rx="3" />
  <rect x="540" y="320" width="22" height="150" fill="url(#bridgePillar)" rx="3" />

  <!-- Light Streaks / Motion Trails -->
  <!-- Saffron Heading Right -->
  <path d="M260 300 Q 380 260, 520 305" stroke="#FF7A00" stroke-width="4" stroke-linecap="round" filter="url(#glowEffect)" />
  <circle cx="520" cy="305" r="5" fill="#FEF08A" />
  <!-- Cyan/Teal Heading Left -->
  <path d="M500 285 Q 360 250, 240 320" stroke="#00D2A0" stroke-width="4" stroke-linecap="round" filter="url(#glowEffect)" />
  <circle cx="240" cy="320" r="5" fill="#67E8F9" />

  <!-- Floating Vehicle 1: Cab (Sedan) -->
  <g transform="translate(420, 260) scale(0.42)">
    <rect x="0" y="20" width="100" height="30" rx="6" fill="#3B82F6" />
    <path d="M20 20 L35 5 L65 5 L80 20 Z" fill="#93C5FD" />
    <circle cx="25" cy="50" r="9" fill="#0F172A" />
    <circle cx="75" cy="50" r="9" fill="#0F172A" />
    <circle cx="95" cy="35" r="4" fill="#FEF08A" filter="url(#glowEffect)" />
  </g>

  <!-- Floating Vehicle 2: Bike Taxi -->
  <g transform="translate(190, 310) scale(0.38)">
    <circle cx="20" cy="30" r="9" fill="#0F172A" />
    <circle cx="60" cy="30" r="9" fill="#0F172A" />
    <path d="M20 30 L35 15 L50 15 L60 30" stroke="#FF7A00" stroke-width="4" stroke-linecap="round" />
    <circle cx="65" cy="18" r="4" fill="#FEF08A" filter="url(#glowEffect)" />
  </g>

  <!-- Floating Vehicle 3: Logistics Truck -->
  <g transform="translate(610, 330) scale(0.4)">
    <rect x="0" y="5" width="80" height="40" rx="3" fill="#EA580C" />
    <path d="M80 45 L80 15 L105 15 L115 30 L115 45 Z" fill="#0F172A" />
    <circle cx="25" cy="45" r="10" fill="#0F172A" />
    <circle cx="50" cy="45" r="10" fill="#0F172A" />
    <circle cx="105" cy="45" r="10" fill="#0F172A" />
    <circle cx="115" cy="35" r="4" fill="#FEF08A" filter="url(#glowEffect)" />
  </g>

  <!-- Overlay Text: Pan-India Transit Network -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">PAN-INDIA SMART TRANSIT</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#00D2A0">120+ CITIES · 500K+ DRIVERS · 24/7 NATIONWIDE SERVICE</text>
  </g>
</svg>
