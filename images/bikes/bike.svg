      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E04000" />
    </linearGradient>
  </defs>
  <!-- Road shadow -->
  <ellipse cx="80" cy="88" rx="65" ry="6" fill="#000000" opacity="0.12" />
  <!-- Wheels -->
  <circle cx="38" cy="68" r="20" fill="#1C2541" />
  <circle cx="38" cy="68" r="13" fill="#E2E8F0" />
  <circle cx="38" cy="68" r="5" fill="#1C2541" />
  <circle cx="122" cy="68" r="20" fill="#1C2541" />
  <circle cx="122" cy="68" r="13" fill="#E2E8F0" />
