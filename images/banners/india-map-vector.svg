<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 750" fill="none">
  <defs>
    <linearGradient id="mapBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="cityGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="700" height="750" fill="url(#mapBgGrad)" rx="16" />
  <g stroke="#334155" stroke-width="0.7" opacity="0.3">
    <line x1="0" y1="100" x2="700" y2="100" />
    <line x1="0" y1="200" x2="700" y2="200" />
    <line x1="0" y1="300" x2="700" y2="300" />
    <line x1="0" y1="400" x2="700" y2="400" />
    <line x1="0" y1="500" x2="700" y2="500" />
    <line x1="0" y1="600" x2="700" y2="600" />
    <line x1="100" y1="0" x2="100" y2="750" />
    <line x1="200" y1="0" x2="200" y2="750" />
    <line x1="300" y1="0" x2="300" y2="750" />
    <line x1="400" y1="0" x2="400" y2="750" />
    <line x1="500" y1="0" x2="500" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
  </g>

  <!-- Simplified Stylized India Geographic Contour -->
  <path d="M260 70 L310 50 L350 70 L340 120 L380 140 L350 170 L360 210 L470 230 L530 210 L590 220 L610 260 L570 290 L520 270 L480 300 L440 370 L410 440 L380 520 L350 620 L320 680 L290 620 L270 540 L240 450 L200 370 L170 330 L160 280 L200 240 L210 180 L240 140 Z" fill="#1E293B" stroke="#00D2A0" stroke-width="2" opacity="0.6" />

  <!-- Major National Transport Corridors (Golden Quadrilateral & North-South East-West) -->
  <!-- Delhi - Mumbai -->
  <path id="corridor-del-mum" d="M290 190 Q 250 280, 210 390" stroke="#FF7A00" stroke-width="3" stroke-linecap="round" />
  <!-- Mumbai - Chennai -->
  <path id="corridor-mum-che" d="M210 390 Q 280 470, 360 520" stroke="#FF7A00" stroke-width="3" stroke-linecap="round" />
  <!-- Chennai - Kolkata -->
  <path id="corridor-che-kol" d="M360 520 Q 430 420, 480 300" stroke="#FF7A00" stroke-width="3" stroke-linecap="round" />
  <!-- Kolkata - Delhi -->
  <path id="corridor-kol-del" d="M480 300 Q 380 230, 290 190" stroke="#FF7A00" stroke-width="3" stroke-linecap="round" />
  <!-- North-South: Srinagar/Delhi - Bengaluru - Kanyakumari -->
  <path id="corridor-ns" d="M290 190 L330 380 L320 540 L310 650" stroke="#00D2A0" stroke-width="2.5" stroke-dasharray="6,4" />
  <!-- Mumbai - Pune - Hyderabad - Bengaluru -->
  <path id="corridor-hyd" d="M210 390 L240 420 L330 420 L320 540" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Key Transport Hub Nodes with Pulses -->
  <!-- New Delhi Hub -->
  <g class="map-node" data-city="Delhi">
    <circle cx="290" cy="190" r="14" fill="#FF7A00" opacity="0.25" />
    <circle cx="290" cy="190" r="7" fill="#FF7A00" filter="url(#cityGlow)" />
    <circle cx="290" cy="190" r="3" fill="#FFFFFF" />
    <text x="306" y="195" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Delhi NCR</text>
    <text x="306" y="209" font-family="sans-serif" font-size="10" fill="#94A3B8">Mega Hub · 12,400+ Cabs</text>
  </g>

  <!-- Mumbai Hub -->
  <g class="map-node" data-city="Mumbai">
    <circle cx="210" cy="390" r="14" fill="#FF7A00" opacity="0.25" />
    <circle cx="210" cy="390" r="7" fill="#FF7A00" filter="url(#cityGlow)" />
    <circle cx="210" cy="390" r="3" fill="#FFFFFF" />
    <text x="110" y="395" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Mumbai</text>
    <text x="80" y="409" font-family="sans-serif" font-size="10" fill="#94A3B8">Metropolitan Hub</text>
  </g>

  <!-- Bengaluru Hub -->
  <g class="map-node" data-city="Bengaluru">
    <circle cx="320" cy="540" r="14" fill="#00D2A0" opacity="0.25" />
    <circle cx="320" cy="540" r="7" fill="#00D2A0" filter="url(#cityGlow)" />
    <circle cx="320" cy="540" r="3" fill="#FFFFFF" />
    <text x="336" y="545" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Bengaluru</text>
    <text x="336" y="559" font-family="sans-serif" font-size="10" fill="#94A3B8">Tech & Fleet HQ</text>
  </g>

  <!-- Hyderabad Hub -->
  <g class="map-node" data-city="Hyderabad">
    <circle cx="330" cy="420" r="6" fill="#38BDF8" />
    <text x="345" y="425" font-family="sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">Hyderabad</text>
  </g>

  <!-- Chennai Hub -->
  <g class="map-node" data-city="Chennai">
    <circle cx="360" cy="520" r="6" fill="#FF7A00" />
    <text x="375" y="525" font-family="sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">Chennai</text>
  </g>

  <!-- Kolkata Hub -->
  <g class="map-node" data-city="Kolkata">
    <circle cx="480" cy="300" r="7" fill="#00D2A0" />
    <text x="495" y="305" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Kolkata</text>
  </g>

  <!-- Jaipur Hub -->
  <g class="map-node" data-city="Jaipur">
    <circle cx="260" cy="225" r="6" fill="#FF7A00" />
    <text x="195" y="228" font-family="sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">Jaipur</text>
  </g>

  <!-- Ahmedabad Hub -->
  <g class="map-node" data-city="Ahmedabad">
    <circle cx="205" cy="310" r="6" fill="#38BDF8" />
    <text x="120" y="315" font-family="sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">Ahmedabad</text>
  </g>

  <!-- Pune Hub -->
  <g class="map-node" data-city="Pune">
    <circle cx="235" cy="425" r="5" fill="#00D2A0" />
    <text x="248" y="430" font-family="sans-serif" font-size="11" fill="#CBD5E1">Pune</text>
  </g>

  <!-- Chandigarh Hub -->
  <g class="map-node" data-city="Chandigarh">
    <circle cx="280" cy="145" r="5" fill="#38BDF8" />
    <text x="295" y="150" font-family="sans-serif" font-size="11" fill="#CBD5E1">Chandigarh</text>
  </g>

  <!-- Kochi Hub -->
  <g class="map-node" data-city="Kochi">
    <circle cx="300" cy="630" r="5" fill="#00D2A0" />
    <text x="315" y="635" font-family="sans-serif" font-size="11" fill="#CBD5E1">Kochi</text>
  </g>

  <!-- Lucknow Hub -->
  <g class="map-node" data-city="Lucknow">
    <circle cx="350" cy="230" r="5" fill="#FF7A00" />
    <text x="365" y="235" font-family="sans-serif" font-size="11" fill="#CBD5E1">Lucknow</text>
  </g>
</svg>
